name: Icônes PWA · PWABuilder
on:
  push:
    branches: [main]
    paths:
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'tools/build-icons.mjs'
      - '.github/workflows/icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Installer sharp
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Rasteriser icon.svg → tous les PNG
        run: node tools/build-icons.mjs

      - name: Committer les icônes (Pages branche ou Actions)
        run: |
          git config user.name  "kev-fusion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icon-*.png apple-*.png apple-touch-icon.png favicon-*.png
          if git diff --cached --quiet; then
            echo "Icônes déjà à jour."
          else
            git commit -m "chore(icons): icônes rallye PWA générées [skip ci]"
            git push
          fi

      - name: Résumé
        run: |
          echo "### Icônes PWA générées" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -1 icon-*.png apple-touch-icon.png | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ouvre **/icons.html** pour le studio live, puis https://www.pwabuilder.com" >> $GITHUB_STEP_SUMMARY
